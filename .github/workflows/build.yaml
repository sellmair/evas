name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests
        run: ./gradlew jvmTest testAndroidHostTest

  test-snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Snippets
        run: ./gradlew checkSnippets

  test-native:
    runs-on: macOS-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - name: Cache Kotlin Native
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('dependencies.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Native Tests
        run: ./gradlew macosArm64Test macosX64Test
